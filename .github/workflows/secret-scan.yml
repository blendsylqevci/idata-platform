name: secret-scan

# Skanim server-side i sekreteve/konfidencialitetit në çdo push & PR.
# Kompenson "Secret scanning / push protection" që plani i GitHub s'e lejon për këtë repo.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # token read-only (konsistent me hardening-un e Actions)

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 pinned 2026-07-04
        with:
          fetch-depth: 0   # skanon të gjithë historinë

      - name: Run gitleaks (binary i pinuar)
        run: |
          set -euo pipefail
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
