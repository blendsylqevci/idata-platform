name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # token read-only (konsistent me hardening-un e Actions / secret-scan.yml)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Postgres nga shërbimi native i GitHub Actions (jo action third-party).
    # Auth = trust: vetëm brenda runner-it të CI, pa fjalëkalim → asnjë sekret.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idata
          POSTGRES_DB: idata
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idata -d idata"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: idata
      PGDATABASE: idata

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # pnpm nga corepack (i brendshëm në Node) — pa action third-party,
      # sepse politika e Actions lejon vetëm action-e github-owned.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Fresh-checkout reproducibility: root scripts backoffice:* ndertojne
      # varesin @idata/platform-api-client PARA Angular-it (Turbo dependency
      # graph), PARA build-it global — deshton nese client-i dist mungon.
      - name: Backoffice reproducible commands (fresh workspace state)
        run: |
          pnpm backoffice:build
          pnpm backoffice:test

      - name: Build (8 workspaces — legacy + backoffice/client)
        run: pnpm build

      - name: Migrate database (nga zero në DB-në e pastër të CI-së)
        run: pnpm --filter @idata/database migrate

      - name: Typecheck (8 workspaces)
        run: pnpm typecheck

      - name: Test (8 workspaces; api/web/database prekin Postgres; backoffice = vitest)
        run: pnpm test

      # ── Target stack ADR-024 (Bootstrap pre-F1) — i NDARE nga legacy ──
      # DB logjike e vecante SINTETIKE: idata_platform_ci (DbMigrator e krijon
      # vete); legacy 'idata' NUK preket. Zero secrets; opt-in-i destruktiv
      # vendoset VETEM inline te komanda down-to-zero, JO job-wide.
      - name: Setup .NET (nga global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Platform tool restore (dotnet-ef i pin-uar)
        run: dotnet tool restore

      - name: Platform restore (locked mode)
        run: dotnet restore src/platform --locked-mode

      - name: Platform build (warnings-as-errors; gjeneron edhe OpenAPI spec)
        run: dotnet build src/platform --no-restore

      - name: Target migration cycle (assert-state per faze; DB sintetike CI)
        env:
          DOTNET_ENVIRONMENT: CI
          PLATFORM_PGDATABASE: idata_platform_ci
        run: |
          M="dotnet run --no-build --project src/platform/Idata.Platform.DbMigrator --"
          # 1. Fresh: 0001+0002+0003 → applied=3, pending=0, sentinel present
          $M migrate
          $M assert-state 3 0 present
          # 2. No-op: 0 të reja → applied=3, pending=0
          $M migrate
          $M assert-state 3 0 present
          # 3. Guarded down-to-zero (opt-in VETEM inline) → applied=0, pending=3, sentinel absent
          IDATA_ALLOW_DESTRUCTIVE_MIGRATION_RESET=YES_I_UNDERSTAND_DATA_WILL_BE_DELETED $M down-to-zero
          $M assert-state 0 3 absent
          # 4. Reapply → applied=3, pending=0, sentinel rikthehet
          $M migrate
          $M assert-state 3 0 present

      - name: Platform tests (unit + architecture + integration kunder target DB)
        run: dotnet test src/platform --no-build

      - name: Contracts drift-check (OpenAPI + generated client, zero diff)
        run: |
          pnpm --filter @idata/platform-api-client generate
          git diff --exit-code -- contracts/openapi packages/platform-api-client/src/generated

      - name: Production OpenAPI regression (kontrata byte-identike nen DOTNET_ENVIRONMENT=Production)
        # ADR-029 §10 / Increment A: AddOpenApi + transformer-at jane te
        # PAKUSHTEZUAR — gjenerimi build-time s'duhet te varet nga environment-i.
        # Rebuild i plote (jo incremental, qe target-i i gjenerimit te mos
        # skip-ohet) + rigjenerim i klientit TS + zero diff i detyruar.
        env:
          DOTNET_ENVIRONMENT: Production
        run: |
          dotnet build src/platform/Idata.Platform.Api --no-restore --no-incremental
          pnpm --filter @idata/platform-api-client generate
          git diff --exit-code -- contracts/openapi packages/platform-api-client/src/generated
