name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # token read-only (konsistent me hardening-un e Actions / secret-scan.yml)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # pnpm vjen nga corepack (i brendshëm në Node) — pa action third-party,
      # sepse politika e Actions lejon vetëm action-e github-owned. Versioni
      # (9.15.0) merret nga `packageManager` te package.json.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
